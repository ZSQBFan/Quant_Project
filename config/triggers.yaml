# ============================================================================
# 触发器配置文件 (Triggers Configuration)
# ============================================================================
#
# 触发器是策略的"感官系统"，负责监测市场状态并提交交易意图。
# 每个触发器只关注一个特定条件，当条件满足时向策略提交建议。
#
# MVP原则：使用最简单的固定阈值，验证触发器系统的架构是否正确。
# ============================================================================

# ----------------------------------------------------------------------------
# 1. 止损触发器 (Stop Loss Trigger)
# ----------------------------------------------------------------------------
# 功能：监控持仓亏损，触发止损卖出
# 逻辑：当某个持仓的浮动亏损 <= threshold 时，提交"止损卖出"意图
stop_loss:
  enabled: true                    # 是否启用此触发器
  threshold: -0.10                 # 止损阈值：-10% (即亏损10%)
  priority: 100                    # 优先级：数值越大越优先执行（风控优先级最高）
  description: "固定10%止损，MVP阶段使用简单百分比阈值"
  notes:
    - "threshold为负数表示亏损幅度"
    - "例：买入价10元，跌至9元以下触发止损"
    - "后续可扩展：移动止损、ATR止损等"

# ----------------------------------------------------------------------------
# 2. 止盈触发器 (Take Profit Trigger)
# ----------------------------------------------------------------------------
# 功能：监控持仓盈利，触发止盈卖出
# 逻辑：当某个持仓的浮动盈利 >= threshold 时，提交"止盈卖出"意图
take_profit:
  enabled: false                   # MVP阶段可选，默认关闭
  threshold: 0.30                  # 止盈阈值：+30% (即盈利30%)
  priority: 90                     # 优先级：略低于止损
  description: "固定30%止盈，MVP阶段暂不启用"
  notes:
    - "threshold为正数表示盈利幅度"
    - "MVP阶段建议关闭，优先验证止损和调仓逻辑"
    - "后续可扩展：分批止盈、动态止盈等"

# ----------------------------------------------------------------------------
# 3. 调仓触发器 (Rebalance Trigger)
# ----------------------------------------------------------------------------
# 功能：按照交易日历触发定期调仓
# 逻辑：检查当前日期是否在 trading_days.json 中，是则提交"调仓"意图
rebalance:
  enabled: true                    # 是否启用定期调仓
  priority: 50                     # 优先级：低于风控，高于其他信号
  calendar_file: "config/trading_days.json"  # 交易日历配置文件路径
  description: "定期调仓触发器，读取trading_days.json"
  notes:
    - "调仓逻辑将调用Pipeline: Selector -> Allocator -> Executor"
    - "如果当天同时触发止损和调仓，止损优先执行"

# ----------------------------------------------------------------------------
# 4. 通用配置 (General Settings)
# ----------------------------------------------------------------------------
general:
  max_triggers_per_day: 100        # 单日最大触发次数（防止异常）
  trigger_log_level: "INFO"        # 触发器日志级别：DEBUG/INFO/WARNING
  description: "触发器系统的全局设置"

# ----------------------------------------------------------------------------
# MVP阶段建议的触发器优先级排序（数值越大越优先）：
# ----------------------------------------------------------------------------
#   100: stop_loss      (止损 - 最高优先级)
#    90: take_profit    (止盈)
#    50: rebalance      (定期调仓)
#    30: signal_*       (其他信号触发器 - 未来扩展)
#
# 优先级机制确保：当多个触发器同时激活时，高优先级的意图会覆盖低优先级的意图。
# 例如：某股票既触发了止损(优先级100)又在调仓日(优先级50)，最终执行止损卖出。
