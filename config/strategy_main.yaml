# ============================================================================
# Backtrader 主策略配置文件 (Main Strategy Configuration)
# ============================================================================
#
# 本配置定义了回测策略的核心逻辑和组件。
# MVP原则：每个组件使用最简实现，验证"Pandas计算 -> Backtrader执行"的数据流。
#
# ============================================================================

# ----------------------------------------------------------------------------
# 1. 策略元信息 (Strategy Metadata)
# ----------------------------------------------------------------------------
strategy:
  name: "MVP_Backtest"                      # 策略名称
  version: "0.1.0"                          # 版本号
  description: "MVP阶段：验证事件驱动回测框架的数据流和控制流"
  author: "Quant Team"
  
  # 止损阈值设置（百分比，负数表示亏损）
  stop_loss: -0.10                          # 止损阈值：-10%
  
  # 调仓参数
  top_n: 10                                 # 选股数量：前10只
  rebalance_frequency: "semi-monthly"       # 调仓频率：半月调仓

  # 策略使用的触发器列表（从 triggers.yaml 读取）
  triggers:
    - stop_loss                              # 止损触发器
    - rebalance                              # 调仓触发器
    # - take_profit                          # 止盈触发器（MVP暂不启用）

# ----------------------------------------------------------------------------
# 2. Pipeline 组件配置 (Pipeline Components)
# ----------------------------------------------------------------------------
# Pipeline 是调仓时的执行流水线：
#   1. Selector（选股器）：从股票池中选出候选股票
#   2. Allocator（权重分配器）：为选中的股票分配权重
#   3. CapitalManager（资金管理器）：决定实际投入的资金比例
#
# MVP原则：所有组件使用最简单的实现。
# ----------------------------------------------------------------------------

pipeline:
  # --- 2.1 选股器 (Stock Selector) ---
  selector:
    class: "TopNSelector"                    # 选股器类名
    params:
      n: 10                                  # 选择因子值最高的前10只股票
      method: "top"                          # 选择方法：top(最大) / bottom(最小)
    description: "最简选股器：选择combined_signal最高的前N只股票"
    notes:
      - "MVP阶段不考虑行业中性、市值限制等复杂逻辑"
      - "直接从Pandas传来的combined_signal中排序取TopN"

  # --- 2.2 权重分配器 (Weight Allocator) ---
  allocator:
    class: "EqualWeightAllocator"            # 权重分配器类名
    params:
      min_weight: 0.05                       # 单只股票最小权重（5%）
      max_weight: 0.20                       # 单只股票最大权重（20%）
    description: "最简分配器：等权重分配（1/N）"
    notes:
      - "MVP阶段：所有选中的股票平均分配权重"
      - "例：选10只股票，每只10%"
      - "后续可扩展：按因子值加权、风险平价等"

  # --- 2.3 资金管理器 (Capital Manager) ---
  capital_manager:
    class: "FullPositionManager"             # 资金管理器类名
    params:
      target_position_ratio: 1.0             # 目标仓位比例：100%（满仓）
      reserve_cash_ratio: 0.0                # 保留现金比例：0%
    description: "最简资金管理：满仓运作"
    notes:
      - "MVP阶段：将可用资金100%投入"
      - "后续可扩展：动态仓位控制、凯利公式等"

# ----------------------------------------------------------------------------
# 3. 数据源配置 (Data Feed Configuration)
# ----------------------------------------------------------------------------
data_feed:
  # Pandas因子数据文件路径（从上游因子分析流程生成）
  combined_signal_path: "data/combined_signal.parquet"

  # 股票池配置
  universe_file: "universe_config.py"        # 股票池定义文件

  # 数据频率
  timeframe: "daily"                         # MVP阶段使用日线数据

  description: "Backtrader的DataFeed仅作搬运工，不做任何因子计算"
  notes:
    - "combined_signal 是上游Pandas计算好的合成信号"
    - "DataFeed只负责将其按日期喂给Backtrader"
    - "验证关键：确保日期对齐，无数据泄露"

# ----------------------------------------------------------------------------
# 4. 回测参数 (Backtest Parameters)
# ----------------------------------------------------------------------------
backtest:
  start_date: "2024-01-01"                   # 回测起始日期
  end_date: "2024-12-31"                     # 回测结束日期

  # 券商参数（从 broker.json 读取更详细配置）
  broker_config_file: "config/broker.json"

  # 基准配置
  benchmark: "600519"                        # 基准代码（茅台，与main_analyzer.py保持一致）

  description: "回测的时间范围和基准设置"

# ----------------------------------------------------------------------------
# 5. 日志与输出 (Logging and Output)
# ----------------------------------------------------------------------------
logging:
  log_dir: "logs"                            # 日志目录
  log_level: "INFO"                          # 日志级别：DEBUG/INFO/WARNING/ERROR
  log_prefix: "backtrader"                   # 日志文件前缀

output:
  report_dir: "backtest_reports"             # 回测报告输出目录
  save_trades: true                          # 是否保存每笔交易记录
  save_positions: true                       # 是否保存每日持仓快照

  description: "使用与main_analyzer.py相同的logger模块"
  notes:
    - "复用 logger/logger_config.py 中的 setup_logging()"
    - "确保日志格式与因子分析流程一致"

# ----------------------------------------------------------------------------
# MVP阶段验证清单 (MVP Validation Checklist)
# ----------------------------------------------------------------------------
# 1. [ ] 数据流：Pandas因子 -> Backtrader DataFeed -> Strategy.next()
# 2. [ ] 触发器：止损触发器能否正确检测亏损并提交意图
# 3. [ ] 调仓：定期调仓能否按交易日历执行
# 4. [ ] Pipeline：Selector -> Allocator -> CapitalManager 串联是否正确
# 5. [ ] 优先级：多个触发器同时激活时，高优先级是否覆盖低优先级
# 6. [ ] 日志：所有关键事件是否都有清晰的日志记录
#
# 完成以上验证后，再考虑算法优化（如：更复杂的选股、动态权重等）。
