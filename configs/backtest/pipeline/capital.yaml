# 资金管理器配置
#
# 定义所有可用的资金管理器及其参数

# ============================================================================
# FullPosition 全仓资金管理器
# ============================================================================
# 使用全部可用资金（保留一定比例缓冲）

FullPosition:
  description: "全仓资金管理，保留一定现金缓冲"
  params:
    utilization_ratio: 0.95  # 资金使用比例，保留5%现金缓冲
  enabled: true

# ============================================================================
# FixedAmount 固定金额资金管理器（预留）
# ============================================================================
# 每只股票固定金额

FixedAmount:
  description: "每只股票使用固定金额"
  params:
    amount_per_stock: 50000  # 每只股票50000元
  enabled: false

# ============================================================================
# Percentage 百分比资金管理器（预留）
# ============================================================================
# 每只股票使用总资金的固定百分比

Percentage:
  description: "每只股票使用总资金的固定百分比"
  params:
    percent_per_stock: 0.05  # 每只股票5%
    max_positions: 20  # 最大持仓数
  enabled: false

# ============================================================================
# KellyCriterion Kelly公式资金管理器（预留）
# ============================================================================
# 使用 Kelly 公式计算最优仓位

KellyCriterion:
  description: "Kelly公式计算最优仓位"
  params:
    win_rate_lookback: 60  # 计算胜率的回看周期
    kelly_fraction: 0.5    # Kelly比例（通常用半凯利）
  enabled: false
