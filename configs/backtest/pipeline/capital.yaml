#     percent_per_stock: 0.05  # 每只股票5%
#     max_positions: 20  # 最大持仓数
#   enabled: false

# ============================================================================
# Full Kelly 完整凯利公式资金管理器
# ============================================================================
# 使用完整凯利公式计算最优仓位
# 核心逻辑：f* = (μ - r) / σ²，最大化长期资本增长率
# 特点：理论最优但波动较大，对参数估计敏感
# 适用场景：对预测模型有高度信心，能承受较大波动

FullKelly:
  description: "完整凯利公式计算最优仓位（kelly_fraction=1.0）"
  params:
    lookback_period: 120    # 计算统计量的回看周期（天数）
    risk_free_rate: 0.02    # 年化无风险利率（默认2%）
    min_periods: 60         # 最小有效数据点数
    max_position: 1      # 最大仓位比例（95%）
    min_position: 0.6       # 最小仓位比例（0%）
  enabled: true

# ============================================================================
# Half Kelly 半凯利公式资金管理器
# ============================================================================
# 使用半凯利公式计算仓位（凯利值的一半）
# 核心逻辑：f* = 0.5 × (μ - r) / σ²
# 特点：平衡收益与风险，波动显著降低，实践中最常用
# 优势：收益率仅略低于Full Kelly，但波动率降低约25%
# 适用场景：追求收益与风险平衡，中等风险承受能力，实际应用推荐

HalfKelly:
  description: "半凯利公式计算仓位（kelly_fraction=0.5）"
  params:
    lookback_period: 120    # 计算统计量的回看周期（天数）
    risk_free_rate: 0.02    # 年化无风险利率（默认2%）
    min_periods: 60         # 最小有效数据点数
    max_position: 0.95      # 最大仓位比例（95%）
    min_position: 0.3       # 最小仓位比例（0%）
  enabled: true

# ============================================================================
# Quarter Kelly 四分之一凯利公式资金管理器
# ============================================================================
# 使用四分之一凯利公式计算仓位（凯利值的四分之一）
# 核心逻辑：f* = 0.25 × (μ - r) / σ²
# 特点：非常保守，显著降低波动和回撤，对参数估计误差不敏感
# 优势：最大回撤小，波动率最低，稳定性高
# 适用场景：风险厌恶型投资者，资金规模较大追求稳定，对回撤有严格限制

QuarterKelly:
  description: "四分之一凯利公式计算仓位（kelly_fraction=0.25）"
  params:
    lookback_period: 120    # 计算统计量的回看周期（天数）
    risk_free_rate: 0.02    # 年化无风险利率（默认2%）
    min_periods: 60         # 最小有效数据点数
    max_position: 0.95      # 最大仓位比例（95%）
    min_position: 0.0       # 最小仓位比例（0%）
  enabled: true
