# 权重分配器配置
#
# 定义所有可用的权重分配器及其参数

# ============================================================================
# EqualWeight 等权重分配器
# ============================================================================
# 所有选中股票等权重配置

EqualWeight:
  description: "所有选中股票等权重分配"
  params: {}
  enabled: true

# # ============================================================================
# # FactorWeight 因子权重分配器（预留）
# # ============================================================================
# # 根据因子值大小按比例分配权重

# FactorWeight:
#   description: "根据因子值按比例分配权重"
#   params:
#     normalize: true  # 是否归一化
#   enabled: false

# ============================================================================
# RiskParity 风险平价分配器 / 波动率倒数加权
# ============================================================================
# 使用风险平价方法分配权重（权重与波动率成反比）
# 核心逻辑：谁稳谁仓位重，谁浪谁仓位轻
# 适用场景：股票池中混杂稳健股和高波动股，避免高波动股主导组合风险

RiskParity:
  description: "风险平价权重分配（波动率倒数加权）"
  params:
    lookback_period: 60  # 计算波动率的回看周期
    min_periods: 30      # 最小有效数据点数
    volatility_floor: 0.0001  # 波动率下限
  enabled: true

# 别名配置：InverseVolatility 就是 RiskParity
InverseVolatility:
  description: "波动率倒数加权（RiskParity别名）"
  params:
    lookback_period: 60
    min_periods: 30
    volatility_floor: 0.0001
  enabled: true

# ============================================================================
# MaxSharpe 最大夏普比分配器
# ============================================================================
# 优化权重以最大化组合夏普比

MaxSharpe:
  description: "最大化夏普比的权重分配"
  params:
    lookback_period: 120  # 计算统计量的回看周期
    risk_free_rate: 0.02  # 年化无风险利率
    min_periods: 60       # 最小有效数据点数
    max_weight: 0.3       # 单只股票的最大权重
  enabled: true

# ============================================================================
# MinimumVariance 全局最小方差分配器 (GMV)
# ============================================================================
# 利用股票间的相关性来最小化组合方差
# 核心逻辑：买两个负相关的股票比不买更安全，通过协方差矩阵优化对冲风险
# 适用场景：希望通过分散化降低波动，让净值曲线变平滑

MinimumVariance:
  description: "全局最小方差组合（利用相关性对冲风险）"
  params:
    lookback_period: 120  # 计算协方差矩阵的回看周期
    min_periods: 60       # 最小有效数据点数
    max_weight: 0.3       # 单只股票的最大权重
    regularization: 0.001 # L2正则化系数，提高数值稳定性
  enabled: true
