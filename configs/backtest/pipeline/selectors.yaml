# 选股器配置
#
# 定义所有可用的选股器及其参数

# ============================================================================
# TopN 选股器
# ============================================================================
# 选择因子值排名前 N 的股票

TopN:
  description: "选择因子值排名最高的N只股票"
  params:
    top_n: 10
  enabled: true

# ============================================================================
# TopPercent 选股器（预留）
# ============================================================================
# 选择因子值排名前 X% 的股票

TopPercent:
  description: "选择因子值排名前X%的股票"
  params:
    top_percent: 0.1  # 前10%
  enabled: false

# ============================================================================
# Threshold 选股器（预留）
# ============================================================================
# 选择因子值超过阈值的股票

Threshold:
  description: "选择因子值超过阈值的股票"
  params:
    threshold: 0.5
    direction: "above"  # "above" 或 "below"
  enabled: false
