# 选股器详细参数配置
#
# 在 config.yaml 中通过 selector 字段选择使用哪个选股器
# 本文件仅定义各选股器的参数，不控制启用/禁用

# ============================================================================
# TopN 选股器
# ============================================================================
# 选择因子值排名前 N 的股票

TopN:
  description: "选择因子值排名最高的N只股票"
  params:
    top_n: 25

# ============================================================================
# IndustryNeutral 行业中性化选股器
# ============================================================================
# 在各行业中均衡选股，降低行业集中风险

IndustryNeutral:
  description: "行业中性化选股器，在各行业中均衡选股"
  params:
    total_stocks: 25           # 总共选择的股票数量
    strategy: "top_industries"          # 分配策略: equal/proportional/top_industries
    stocks_per_industry: null  # 每个行业选择的数量（仅 equal 策略）
    top_industries: 5       # 选择的行业数量（仅 top_industries 策略）
    min_stocks_per_industry: 2 # 每个行业最少选择数量
