# Backtrader 回测系统 - 总编排配置
#
# 此文件包含回测的核心参数配置
# Pipeline 组件和触发器的详细配置分别在 pipeline/ 和 triggers/ 子目录中

# ============================================================================
# 基础配置
# ============================================================================

# 回测日期范围（如不指定，则从 data/config.yaml 继承）
start_date: null
end_date: null

# ============================================================================
# 券商配置
# ============================================================================
# MVP阶段使用简化的成本模型，后续可扩展为更真实的券商费率

broker:
  initial_cash: 1000000  # 初始资金：100万元人民币

  # 佣金配置
  commission:
    rate: 0.001  # 万分之十 (0.1%)，接近A股实际佣金

# ============================================================================
# Pipeline 组件选择
# ============================================================================
# 详细参数配置见 pipeline/ 目录下的对应文件

# 选股器（详见 pipeline/selectors.yaml）
# 可选值: TopN, IndustryNeutral
selector: TopN

# 权重分配器（详见 pipeline/allocators.yaml）
allocator: EqualWeight

# 资金管理器（详见 pipeline/capital.yaml）
capital_manager: FullPosition

# ============================================================================
# 触发器选择
# ============================================================================
# 详细参数配置见 triggers/ 目录

triggers:
  - type: RebalanceDay
    config_file: rebalance.yaml
  - type: StopLoss
    config_file: stop_loss.yaml

# ============================================================================
# 基准配置
# ============================================================================

benchmark: "600519"  # 基准股票（贵州茅台）

# ============================================================================
# 输出配置
# ============================================================================

output:
  dir: "output/bt_reports"
  bt_data_dir: "temp/backtest_data"  # 回测数据导出目录

# ============================================================================
# 执行配置 (高级性能优化)
# ============================================================================
execution:
  # 是否预加载所有数据到内存 (对于大量股票建议设为 false)
  preload: true

  # 是否使用向量化运行一次模式 (对于大量股票且未对齐数据建议设为 false，使用事件驱动模式)
  runonce: true
