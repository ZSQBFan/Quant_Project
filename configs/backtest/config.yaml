# Backtrader 回测系统 - 总编排配置
#
# 此文件包含回测的核心参数配置
# Pipeline 组件和触发器的详细配置分别在 pipeline/ 和 triggers/ 子目录中

# ============================================================================
# 基础配置
# ============================================================================

# 回测日期范围（如不指定，则从 data/config.yaml 继承）
start_date: null
end_date: null

initial_cash: 1000000.0
commission: 0.0003  # 万分之三手续费

# ============================================================================
# Pipeline 组件选择
# ============================================================================
# 详细参数配置见 pipeline/ 目录下的对应文件

# 选股器（详见 pipeline/selectors.yaml）
selector: TopN

# 权重分配器（详见 pipeline/allocators.yaml）
allocator: EqualWeight

# 资金管理器（详见 pipeline/capital.yaml）
capital_manager: FullPosition

# ============================================================================
# 触发器选择
# ============================================================================
# 详细参数配置见 triggers/ 目录

triggers:
  - type: RebalanceDay
    config_file: rebalance.yaml
  - type: StopLoss
    config_file: stop_loss.yaml

# ============================================================================
# 基准配置
# ============================================================================

benchmark: "600519"  # 基准股票（贵州茅台）

# ============================================================================
# 输出配置
# ============================================================================

output:
  dir: "output/bt_reports"
  save_trades: true
  save_portfolio: true
  generate_report: true
