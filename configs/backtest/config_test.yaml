# Backtrader 回测系统 - 测试配置（简化版）

# ============================================================================
# 基础配置
# ============================================================================

# 回测日期范围（与数据配置保持一致）
start_date: 2023-12-01
end_date: 2024-01-31

initial_cash: 1000000.0
commission: 0.0003  # 万分之三手续费

# ============================================================================
# Pipeline 组件选择
# ============================================================================

# 选股器（简化配置）
selector: TopN

# 权重分配器
allocator: EqualWeight

# 资金管理器
capital_manager: FullPosition

# ============================================================================
# 触发器选择（简化配置）
# ============================================================================

triggers:
  - type: RebalanceDay
    config_file: rebalance.yaml

# ============================================================================
# 基准配置
# ============================================================================

benchmark: "600519"  # 贵州茅台

# ============================================================================
# 输出配置
# ============================================================================

output:
  dir: "output/bt_reports"
  save_trades: true
  save_portfolio: true
  generate_report: true