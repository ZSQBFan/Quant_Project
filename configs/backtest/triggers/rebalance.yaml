# 调仓触发器配置
#
# 定义调仓日期和调仓规则

# ============================================================================
# RebalanceDay 动态调仓触发器
# ============================================================================
# 根据回测日期范围动态生成调仓日期

RebalanceDay:
  description: "根据频率动态生成调仓日期"
  enabled: true
  params:
    # 每月调仓：指定每月的调仓日期 (1-31)
    # 如果该月没有该日期，使用该月最后一天
    frequency: "monthly"
    monthday: 3

    # 每周调仓：指定周几调仓 (0=周一, 1=周二, ..., 4=周五, 5=周六, 6=周日)
    # frequency: "weekly"
    # weekday: 0

    # 间隔调仓：每隔N个交易日调仓
    # frequency: "interval"
    # interval_days: 20

# ============================================================================
# PeriodicRebalance 周期性调仓触发器（预留）
# ============================================================================
# 按固定周期自动调仓

# PeriodicRebalance:
#   description: "按固定周期调仓"
#   enabled: false
#   params:
#     frequency: "MS"  # 'D'=日, 'W'=周, 'MS'=月初, 'ME'=月末
#     skip_first_n_days: 0  # 跳过开始的N个交易日

# ============================================================================
# SignalRebalance 信号触发调仓器（预留）
# ============================================================================
