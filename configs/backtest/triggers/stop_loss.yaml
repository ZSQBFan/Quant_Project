# 止损触发器配置
#
# 定义止损规则

# ============================================================================
# StopLoss 固定比例止损触发器
# ============================================================================
# 当个股亏损超过阈值时止损

StopLoss:
  description: "固定比例止损"
  enabled: true
  params:
    loss_threshold: -0.10  # 止损线10%（负值表示亏损）

# ============================================================================
# TrailingStop 追踪止损触发器（预留）
# ============================================================================
# 从最高点回撤超过阈值时止损

# TrailingStop:
#   description: "追踪止损（从最高点回撤）"
#   enabled: false
#   params:
#     trailing_percent: 0.15  # 从最高点回撤15%止损
#     activation_profit: 0.05  # 盈利5%后激活追踪止损

# # ============================================================================
# # TimedStop 时间止损触发器（预留）
# # ============================================================================
# # 持仓超过一定时间后强制平仓

# TimedStop:
#   description: "持仓时间超限止损"
#   enabled: false
#   params:
#     max_holding_days: 60  # 最大持仓天数

# ============================================================================
# VolatilityStop 波动率止损触发器（预留）
# ============================================================================
# 根据股票波动率动态调整止损线

VolatilityStop:
  description: "基于波动率的动态止损"
  enabled: false
  params:
    atr_multiplier: 2.0  # ATR 倍数
    atr_period: 14  # ATR 计算周期
