# 因子合成策略配置
#
# 定义因子合成策略及其参数
# 每个策略指定使用哪个合成器、标准化器，以及是否使用滚动计算

# ============================================================================
# 静态策略（Static Strategies）
# ============================================================================
# 使用固定或简单规则的因子合成策略

EqualWeights:
  combiner: EqualWeight
  combiner_params: {}
  standardizer: ZScore
  description: "等权重合成策略"

FixedWeights:
  combiner: FixedWeight
  combiner_params:
    factor_weights:
      BollingerBands: 0.3
      Momentum: 0.7
  standardizer: ZScore
  description: "固定权重合成策略"

DynamicSignificance:
  combiner: DynamicSignificance
  combiner_params: {}
  standardizer: ZScore
  description: "动态显著性加权策略"

# ============================================================================
# 滚动策略（Rolling Strategies）
# ============================================================================
# 使用滚动窗口动态优化权重的策略

RollingICIR:
  combiner: DynamicWeight
  combiner_params:
    factor_weights: {}  # 由滚动计算器动态更新
  standardizer: ZScore
  rolling:
    calculator_type: ICIR
    rolling_window_days: 90
    rebalance_frequency: D  # 'D'=日, 'W'=周, 'MS'=月初
    factor_weighting_config:
      Momentum: ic_mean_30d
      Reversal20D: ir_30d
      IndNeu_Momentum: ir_20d
      IndNeu_Reversal20D: ir_5d
      IndNeu_VolumeCV: ic_mean_10d
  description: "IC/IR滚动优化策略"

RollingRegression:
  combiner: DynamicWeight
  combiner_params:
    factor_weights: {}
  standardizer: ZScore
  rolling:
    calculator_type: Regression
    rolling_window_days: 90
    rebalance_frequency: D
    target_return_period: 30
  description: "回归滚动优化策略"

# ============================================================================
# 机器学习策略（ML Strategies）
# ============================================================================

LightGBM_Periodic:
  combiner: AICombiner
  combiner_params:
    initial_model_path: null  # 首次训练为null，后续可指定路径
  standardizer: ZScore
  rolling:
    calculator_type: AI_Trainer
    rolling_window_days: 250
    rebalance_frequency: MS  # 每月初重新训练
    trainer_class: LightGBMTrainer
    trainer_params:
      target_return_period: 30
      model_params:
        objective: regression_l1
        metric: rmse
        n_estimators: 300
        learning_rate: 0.03
        num_leaves: 31
        num_threads: 8
        max_depth: 6
        min_child_samples: 50
        subsample: 0.8
        colsample_bytree: 0.7
        random_state: 42
        n_jobs: -1
        verbose: -1
        reg_alpha: 0.1
        reg_lambda: 0.1
  description: "LightGBM机器学习策略"

# ============================================================================
# LLM策略（LLM Strategies）
# ============================================================================

AdversarialLLM:
  combiner: DynamicWeight
  combiner_params:
    factor_weights: {}
  standardizer: ZScore
  rolling:
    calculator_type: AdversarialLLM
    rolling_window_days: 90
    rebalance_frequency: MS
    api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    api_key: "sk-***"  # 请替换为实际API密钥
    max_rounds: 2
    include_factor_values: true
    include_conversation_history: true
    allow_negative_weights: true
  description: "对抗式LLM优化策略"
