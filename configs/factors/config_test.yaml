# 因子评测系统 - 测试配置（简化版）

# ============================================================================
# 基础配置
# ============================================================================

# 分析日期范围（与数据配置保持一致）
start_date: 2023-12-01
end_date: 2024-01-31

# ============================================================================
# 收益率计算配置
# ============================================================================

forward_return_periods:
  - 1    # 1日收益率
  - 5    # 5日收益率（周度）
  - 10   # 10日收益率

# ============================================================================
# 因子计算配置
# ============================================================================

factor_calculation:
  # 并行计算进程数（减少以加快测试）
  num_processes: 2
  # 是否跳过数据准备阶段
  skip_data_preparation: true
  # 批处理大小
  batch_size: 50

# ============================================================================
# 因子选择配置（白名单模式）- 仅启用少量因子
# ============================================================================

enabled_factors:
  # --- 简单因子 (逐只股票计算) ---
  - Reversal20D        # 20日反转因子
  
  # --- 复合因子 (跨股票向量化计算，行业中性处理) ---
  - IndNeu_Momentum    # 行业中性动量因子
  - IndNeu_EP          # 行业中性市盈率倒数 (E/P)

# ============================================================================
# 策略选择 - 使用简单的等权策略
# ============================================================================

default_strategy: EqualWeights

# ============================================================================
# 标准化配置
# ============================================================================

default_standardizer: ZScore

# ============================================================================
# 基准配置
# ============================================================================

benchmark: "600519"  # 贵州茅台

# ============================================================================
# 输出配置 - 启用因子数据导出到temp/data_explore
# ============================================================================

output:
  dir: "output/factor_reports"
  save_factor_data: true
  save_analysis_results: true
  export_factor_data: true  # 关键：启用因子数据导出
  generate_html_report: true
  generate_pdf_report: false
  export_composite_factor:
    enabled: true  # 启用复合因子导出
    dir: "temp/data_explore"
    format: "parquet"
    by_day: true