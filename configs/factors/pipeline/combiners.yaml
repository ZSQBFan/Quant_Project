# 因子合成器配置
#
# 定义所有可用的因子合成器及其参数

# ============================================================================
# EqualWeight 等权重合成器
# ============================================================================
# 所有因子等权重合成

EqualWeight:
  description: "所有因子等权重合成"
  params: {}
  enabled: true

# ============================================================================
# FixedWeight 固定权重合成器
# ============================================================================
# 使用预设的固定权重

FixedWeight:
  description: "使用预设的固定权重合成"
  params:
    # 示例权重配置（在 strategies.yaml 中覆盖）
    factor_weights:
      BollingerBands: 0.3
      Momentum: 0.7
  enabled: true

# ============================================================================
# DynamicWeight 动态权重合成器
# ============================================================================
# 权重由滚动计算器动态更新

DynamicWeight:
  description: "动态权重合成（与滚动计算器配合使用）"
  params:
    factor_weights: {}  # 由滚动计算器动态更新
  enabled: true

# ============================================================================
# DynamicSignificance 动态显著性合成器
# ============================================================================
# 根据因子的统计显著性动态调整权重

DynamicSignificance:
  description: "根据因子统计显著性动态调整权重"
  params:
    significance_threshold: 0.05  # t检验显著性阈值
    lookback_period: 60  # 计算显著性的回看周期
  enabled: true

# ============================================================================
# AICombiner AI合成器
# ============================================================================
# 使用机器学习模型进行因子合成

AICombiner:
  description: "使用机器学习模型进行因子合成"
  params:
    initial_model_path: null  # 首次训练为null
    model_type: "LightGBM"
  enabled: true
