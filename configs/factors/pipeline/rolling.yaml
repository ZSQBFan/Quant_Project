# 滚动计算器配置
#
# 定义所有可用的滚动优化器及其参数

# ============================================================================
# ICIR 滚动计算器
# ============================================================================
# 基于 IC/IR 指标优化因子权重

ICIR:
  description: "基于IC/IR指标优化因子权重"
  enabled: true
  params:
    rolling_window_days: 90
    rebalance_frequency: "D"  # 'D'=日, 'W'=周, 'MS'=月初
    # IC计算配置
    ic_method: "rank"  # "rank" 或 "pearson"
    # 因子权重配置方式（可选择使用哪个IC指标）
    weighting_metrics:
      - ic_mean_30d    # 30日IC均值
      - ic_mean_20d    # 20日IC均值
      - ic_mean_10d    # 10日IC均值
      - ir_30d         # 30日IR
      - ir_20d         # 20日IR
      - ir_5d          # 5日IR

# ============================================================================
# Regression 回归滚动计算器
# ============================================================================
# 使用回归模型估计因子权重

Regression:
  description: "使用回归模型估计因子权重"
  enabled: true
  params:
    rolling_window_days: 90
    rebalance_frequency: "D"
    target_return_period: 30  # 预测目标收益率周期
    regularization: "ridge"   # "ridge", "lasso", "elastic_net"
    alpha: 0.1                # 正则化系数

# ============================================================================
# AI_Trainer AI训练滚动计算器
# ============================================================================
# 使用机器学习模型进行滚动训练

AI_Trainer:
  description: "机器学习模型滚动训练"
  enabled: true
  params:
    rolling_window_days: 250
    rebalance_frequency: "MS"  # 月初调仓
    trainer_class: "LightGBMTrainer"
    target_return_period: 30
    # 模型超参数
    model_params:
      objective: regression_l1
      metric: rmse
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      num_threads: 8
      max_depth: 6
      min_child_samples: 50
      subsample: 0.8
      colsample_bytree: 0.7
      random_state: 42
      n_jobs: -1
      verbose: -1
      reg_alpha: 0.1
      reg_lambda: 0.1

# ============================================================================
# AdversarialLLM 对抗式LLM滚动计算器
# ============================================================================
# 使用大语言模型进行因子权重优化

AdversarialLLM:
  description: "对抗式LLM因子权重优化"
  enabled: true
  params:
    rolling_window_days: 90
    rebalance_frequency: "MS"
    api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    api_key: "sk-***"  # 请替换为实际API密钥，或使用环境变量 ${LLM_API_KEY}
    model_name: "qwen-plus"
    max_rounds: 2
    include_factor_values: true
    include_conversation_history: true
    allow_negative_weights: true
    temperature: 0.7
