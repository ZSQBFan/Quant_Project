# 标准化器配置
#
# 定义所有可用的因子标准化器及其参数

# ============================================================================
# ZScore 标准化器
# ============================================================================
# 截面 Z-Score 标准化

ZScore:
  description: "截面Z-Score标准化"
  params:
    winsorize: true  # 是否进行极值处理
    winsorize_limits: [0.01, 0.99]  # 极值处理百分位

# ============================================================================
# Quantile 分位数标准化器
# ============================================================================
# 将因子值转换为分位数

Quantile:
  description: "分位数标准化"
  params:
    n_quantiles: 100  # 分位数数量
    output_distribution: "normal"  # 输出分布类型: "uniform"(均匀分布) 或 "normal"(正态分布)

# 配置示例：
#
# 使用均匀分布（默认）：
# Quantile:
#   n_quantiles: 100
#   output_distribution: "uniform"
#
# 使用正态分布：
# Quantile:
#   n_quantiles: 100
#   output_distribution: "normal"

# ============================================================================
# MinMax 最大最小标准化器
# ============================================================================
# 将因子值缩放到 [0, 1] 区间

MinMax:
  description: "最大最小标准化"
  params:
    feature_range: [0, 1]

# ============================================================================
# Rank 排名标准化器
# ============================================================================
# 将因子值转换为排名

Rank:
  description: "排名标准化"
  params:
    ascending: true  # 升序排名
    pct: true  # 返回百分位排名

# ============================================================================
# MAD 中位数绝对偏差标准化器
# ============================================================================
# 使用中位数和MAD进行稳健标准化

MAD:
  description: "中位数绝对偏差标准化（稳健）"
  params:
    scale_factor: 1.4826  # 与正态分布标准差的换算系数
