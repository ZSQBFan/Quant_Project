# 因子评测系统 - 总编排配置
#
# 此文件包含因子分析的核心参数配置
# 因子定义、Pipeline组件、策略配置分别在各子目录中

# ============================================================================
# 基础配置
# ============================================================================

# 分析日期范围（如不指定，则从 data/config.yaml 继承）
start_date: null
end_date: null

# ============================================================================
# 收益率计算配置
# ============================================================================

forward_return_periods:
  - 1    # 1日收益率
  - 5    # 5日收益率（周度）
  - 10   # 10日收益率
  - 20   # 20日收益率（月度）
  - 30   # 30日收益率

# ============================================================================
# 因子计算配置
# ============================================================================

factor_calculation:
  # 并行计算进程数
  num_processes: 8
  # 是否跳过数据准备阶段
  skip_data_preparation: true
  # 批处理大小
  batch_size: 100

# ============================================================================
# 默认策略选择
# ============================================================================
# 详见 strategies.yaml

default_strategy: EqualWeights

# ============================================================================
# 标准化配置
# ============================================================================
# 详见 pipeline/standardizers.yaml

default_standardizer: ZScore

# ============================================================================
# 基准配置
# ============================================================================

benchmark: "600519"  # 贵州茅台

# ============================================================================
# 输出配置
# ============================================================================

output:
  dir: "output/factor_reports"
  save_factor_data: true
  save_analysis_results: true
  generate_html_report: true
  generate_pdf_report: false
