# SQLite 数据提供者配置 (CSMR 数据库)
#
# 从本地 SQLite 数据库读取数据 (CSMR 数据源)

# ============================================================================
# 基础配置
# ============================================================================

enabled: true

# ============================================================================
# 数据库连接配置
# ============================================================================

connection:
  # 主数据库路径 (CSMR 数据源)
  db_path: "./database/CSMR/CSMR_stock_daily_price.sqlite"

# ============================================================================
# 表配置
# ============================================================================

tables:
  # 日线数据表
  daily:
    table_name: "daily_price"
    # 列名映射（数据库列名 -> 标准列名）
    column_mapping:
      TradingDate: date
      Symbol: code
      OpenPrice: open
      HighPrice: high
      LowPrice: low
      ClosePrice: close
      Volume: volume
      Amount: turnover
      ChangeRatio: pct_change
    # 日期格式
    date_format: "%Y-%m-%d"
