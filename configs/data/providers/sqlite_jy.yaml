# SQLite 数据提供者配置
#
# 从本地 SQLite 数据库读取数据

# ============================================================================
# 基础配置
# ============================================================================

enabled: true

# ============================================================================
# 数据库连接配置
# ============================================================================

connection:
  # 主数据库路径
  db_path: "./database/JY_database/sqlite/JY_database.sqlite"

# ============================================================================
# 表配置
# ============================================================================

tables:
  # 日线数据表
  daily:
    table_name: "JY_t_price_daily"
    # 列名映射（数据库列名 -> 标准列名）
    column_mapping:
      _date: date
      ticker: code
      _open: open
      _high: high
      _low: low
      _close: close
      _volume: volume
      _value: turnover
      _return: pct_change
    # 日期格式
    date_format: "%Y-%m-%d"