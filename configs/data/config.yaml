# 数据管理系统 - 总编排配置
#
# 此文件包含数据下载和管理的核心参数配置
# 数据源配置分别在 providers/ 子目录中

# ============================================================================
# 基础配置
# ============================================================================

# 数据日期范围 （格式：YYYY-MM-DD）
start_date: 2021-01-01
end_date: 2024-01-01

# ============================================================================
# 股票池配置
# ============================================================================

# 是否使用全部股票（忽略universe.yaml中的股票池）
use_all_stocks: true

# ============================================================================
# 数据库配置
# ============================================================================

database:
  # 本地缓存数据库路径
  db_path: "./database/quant_data.db"

# ============================================================================
# 数据提供者优先级
# ============================================================================
# 按优先级顺序尝试获取数据

provider_priority:
  - sqlite_csmr  # 最高优先级 - CSMR 数据库
  # - sqlite_jy       # 第二优先级 - JY 数据库
  # - tushare     # 备用数据源
  # - akshare     # 最后备用数据源

# ============================================================================
# 下载配置
# ============================================================================

download:
  # 并发线程数
  num_checker_threads: 16
  num_downloader_threads: 16
  # 批处理大小
  batch_size: 200
  # 重试次数
  max_retries: 1
  # 重试间隔（秒）
  retry_delay: 1.0
  # 请求超时（秒）
  timeout: 30

# ============================================================================
# 数据完整性检查
# ============================================================================

integrity:
  # 是否在下载前检查数据完整性
  check_before_download: true
  # 允许的最大缺失天数比例
  max_missing_ratio: 0.1
  # 是否自动填充缺失数据
  auto_fill_missing: false
  # 填充方法 (forward, backward, interpolate)
  fill_method: "forward"

# ============================================================================
# 输出配置
# ============================================================================

output:
  # 日志级别
  log_level: "INFO"
  # 是否显示进度条
  show_progress: true
