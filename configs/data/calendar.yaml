# 交易日历配置
#
# 定义A股交易日历获取方式和缓存策略

# ============================================================================
# 日历提供者配置
# ============================================================================

provider:
  # 默认提供者 (tushare, akshare, local)
  default: "akshare"

  # 本地缓存
  cache:
    enabled: true
    # 缓存文件路径
    cache_file: "./temp/trading_calendar.json"
    # 缓存有效期（天）
    cache_days: 30
    # 自动更新
    auto_update: true

  # Tushare 日历
  tushare:
    enabled: true
    # 使用 data/providers/tushare.yaml 中的 token
    api_name: "trade_cal"
    params:
      exchange: "SSE"  # 上交所

  # Akshare 日历
  akshare:
    enabled: true
    function: "tool_trade_date_hist_sina"

