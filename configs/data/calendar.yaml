# 交易日历配置
#
# 定义A股交易日历获取方式和缓存策略

# ============================================================================
# 日历提供者配置
# ============================================================================

provider:
  # 默认提供者 (tushare, akshare, local)
  default: "akshare"

  # 本地缓存
  cache:
    enabled: true
    # 缓存文件路径
    cache_file: "./temp/trading_calendar.json"
    # 缓存有效期（天）
    cache_days: 30
    # 自动更新
    auto_update: true

  # Tushare 日历
  tushare:
    enabled: true
    # 使用 data/providers/tushare.yaml 中的 token
    api_name: "trade_cal"
    params:
      exchange: "SSE"  # 上交所

  # Akshare 日历
  akshare:
    enabled: true
    function: "tool_trade_date_hist_sina"

# ============================================================================
# 默认交易时段
# ============================================================================

trading_hours:
  # 上午
  morning:
    open: "09:30"
    close: "11:30"
  # 下午
  afternoon:
    open: "13:00"
    close: "15:00"

# ============================================================================
# 特殊日期配置
# ============================================================================

special_dates:
  # 春节（示例，实际应从日历获取）
  spring_festival: []
  # 国庆
  national_day: []
  # 其他节假日
  other_holidays: []

# ============================================================================
# 验证配置
# ============================================================================

validation:
  # 最小交易日间隔（天）- 用于检测异常
  min_gap_days: 1
  # 最大交易日间隔（天）- 超过则警告
  max_gap_days: 10
  # 每年预期交易日数范围
  expected_trading_days_per_year: [240, 252]
